name: Cap nhat thoi tiet 24/7

on:
  schedule:
    # Tự động chạy mỗi 10 phút một lần, liên tục 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công bất cứ lúc nào

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cai dat thu vien requests
        run: pip install requests

      - name: Gui du lieu len ThingsBoard
        run: python code.py
